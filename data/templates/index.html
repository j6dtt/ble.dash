<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USCENTCOM - LAZY GOBY BLE TAG VIEWER</title>
<link rel="stylesheet" href="/static/leaflet/leaflet.css"/>
<script src="/static/leaflet/leaflet.js"></script>
<script src="/static/leaflet/leaflet-heat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }

#topbar {
  height: 56px; background: #161b22; border-bottom: 1px solid #30363d;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 18px;
}
#brand-link { justify-self: center; text-decoration: none; transition: opacity .15s; }
#brand-link:hover { opacity: .8; }
#brand { display: flex; align-items: baseline; gap: 14px; white-space: nowrap; }
#brand-tag {
  font-size: 1.5rem; font-weight: 800; letter-spacing: .3px;
  background: linear-gradient(90deg, #3fb950, #7ee2a8 70%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#brand-name {
  font-size: 1.5rem; font-weight: 800; letter-spacing: .3px;
  background: linear-gradient(90deg, #58a6ff, #a5d6ff 70%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#brand-sub {
  font-size: .95rem; font-weight: 600; letter-spacing: 1px;
  color: #8b949e; text-transform: uppercase;
}

#topbar-right { justify-self: end; display: flex; align-items: center; gap: 18px; }
#live-wrap { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: #8b949e; }
#live-dot { width: 9px; height: 9px; border-radius: 50%; background: #30363d; transition: background .4s; }
#live-dot.on { background: #3fb950; box-shadow: 0 0 6px #3fb950; }

/* ── User menu ─────────────────────────────────────────────────── */
#user-menu { position: relative; }
#user-menu-btn {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 6px;
  border-radius: 8px; background: transparent; border: 1px solid transparent;
  color: #c9d1d9; font-size: .78rem; cursor: pointer;
}
#user-menu-btn:hover { background: #21262d; border-color: #30363d; }
#user-avatar {
  width: 24px; height: 24px; border-radius: 50%; background: #2563eb;
  color: #fff; font-size: .68rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
#user-menu-caret { font-size: .6rem; color: #8b949e; transition: transform .15s; }
#user-menu.open #user-menu-caret { transform: rotate(180deg); }
#user-menu-dropdown {
  position: absolute; top: calc(100% + 8px); right: 0; width: 210px; z-index: 900;
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.5); overflow: hidden; display: none;
}
#user-menu.open #user-menu-dropdown { display: block; }
#user-menu-header { padding: 12px 14px; border-bottom: 1px solid #30363d; }
#user-menu-fullname { font-size: .85rem; font-weight: 600; color: #c9d1d9; }
#user-menu-username { font-size: .7rem; color: #8b949e; font-family: monospace; margin-top: 2px; }
#user-menu-role {
  display: inline-block; margin-top: 5px; font-size: .62rem; text-transform: uppercase;
  letter-spacing: .5px; padding: 1px 7px; border-radius: 8px;
  background: #21262d; color: #8b949e; border: 1px solid #30363d;
}
#user-menu-role.admin { color: #e3b341; border-color: #e3b341; background: #2b2000; }
.user-menu-item {
  display: block; width: 100%; text-align: left; padding: 9px 14px;
  background: none; border: none; color: #c9d1d9; font-size: .78rem; cursor: pointer;
  text-decoration: none; box-sizing: border-box;
}
.user-menu-item:hover { background: #21262d; }
.user-menu-item.danger:hover { color: #f85149; }

#main { display: flex; height: calc(100vh - 56px); }
#map  { flex: 1; position: relative; }

/* Attribution moved to top-right, away from the detail bar */
.leaflet-bottom.leaflet-right { bottom: auto; top: 0; }

/* ── Detail bar (shown only while a device is drilled into) ───────── */
#detailbar {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 800;
  display: none; align-items: center; gap: 10px;
  background: rgba(22,27,34,0.93); backdrop-filter: blur(4px);
  padding: 9px 14px; border-top: 1px solid #30363d;
}
#detail-name { font-size: .78rem; font-weight: 700; color: #58a6ff; letter-spacing: .3px; }
#detail-archive {
  margin-left: auto; flex-shrink: 0; height: 28px; padding: 0 10px;
  border-radius: 4px; background: #21262d; border: 1px solid #30363d;
  color: #c9d1d9; font-size: .75rem; cursor: pointer; white-space: nowrap;
}
#detail-archive:hover { background: #2b2000; border-color: #e3b341; color: #e3b341; }
#detail-back {
  flex-shrink: 0; height: 28px; padding: 0 10px;
  border-radius: 4px; background: #21262d; border: 1px solid #30363d;
  color: #c9d1d9; font-size: .75rem; cursor: pointer; white-space: nowrap;
}
#detail-back:hover { background: #30363d; border-color: #58a6ff; color: #58a6ff; }

#window-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
#window-range {
  width: 120px; -webkit-appearance: none; appearance: none;
  height: 20px; background: transparent; outline: none; cursor: pointer;
}
#window-range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: #30363d; }
#window-range::-moz-range-track          { height: 4px; border-radius: 2px; background: #30363d; }
#window-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; margin-top: -5px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #58a6ff; border: 2px solid #0d1117; cursor: pointer;
}
#window-range::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: #58a6ff; border: 2px solid #0d1117; cursor: pointer;
}
#window-label { font-size: .72rem; color: #8b949e; white-space: nowrap; min-width: 82px; }

#mode-control { display: flex; gap: 6px; flex-shrink: 0; }
.mode-btn {
  height: 28px; padding: 0 10px;
  border-radius: 4px; background: #21262d; border: 1px solid #30363d;
  color: #c9d1d9; font-size: .75rem; cursor: pointer; white-space: nowrap;
}
.mode-btn:hover  { border-color: #58a6ff; color: #58a6ff; }
.mode-btn.active { border-color: #e3b341; color: #e3b341; background: #2b2000; }

/* ── Device panel ─────────────────────────────────── */
#panel {
  width: 270px; background: #161b22; border-left: 1px solid #30363d;
  display: flex; flex-direction: column; overflow: hidden;
}
#panel-header {
  padding: 8px 10px; border-bottom: 1px solid #30363d;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
#panel-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
/* Device-name label shown only while drilled into a device (log view) —
   #view-tabs takes over this spot the rest of the time. */
#panel-title {
  display: none; font-size: .82rem; font-weight: 600; color: #c9d1d9;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#view-tabs-wrap { display: flex; flex-direction: column; gap: 3px; }
#view-tabs-label {
  font-size: .62rem; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
  color: #6e7681;
}
#view-tabs { display: flex; align-items: center; gap: 2px; }
.view-tab {
  font-size: .76rem; font-weight: 600; padding: 5px 13px; border-radius: 6px;
  white-space: nowrap; cursor: pointer; background: transparent; border: none;
  color: #8b949e; transition: background .15s, color .15s;
}
.view-tab:hover  { color: #c9d1d9; background: #21262d; }
.view-tab.active { color: #58a6ff; background: #17233b; }
#device-count { background: #21262d; padding: 1px 7px; border-radius: 10px; color: #c9d1d9; font-size: .75rem; flex-shrink: 0; }
#search-wrap { padding: 8px 10px 0; }
#device-search {
  width: 100%; height: 30px; padding: 0 10px; border-radius: 6px;
  background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; font-size: .8rem; outline: none;
}
#device-search:focus { border-color: #58a6ff; }
#device-search::placeholder { color: #6e7681; }
#device-list  { flex: 1; overflow-y: auto; padding: 8px; }
.group-check { flex-shrink: 0; cursor: pointer; accent-color: #58a6ff; }
.device-check { flex-shrink: 0; cursor: pointer; accent-color: #58a6ff; }
.card.device-hidden { opacity: .45; }
.group-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; min-width: 0; }
.group-arrow { flex-shrink: 0; color: #8b949e; font-size: .65rem; width: 8px; }
#empty { color: #8b949e; font-size: .82rem; text-align: center; padding: 24px 0; }

.card {
  background: #21262d; border: 1px solid #30363d; border-radius: 6px;
  padding: 10px 12px; margin-bottom: 6px; transition: border-color .2s;
  cursor: pointer;
}
.card:hover  { border-color: #58a6ff; }
.card.active { border-color: #58a6ff; }

.group-header {
  font-size: .68rem; text-transform: uppercase; letter-spacing: 1px; color: #8b949e;
  display: flex; align-items: center; gap: 6px;
  margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #21262d;
}
.group-header:first-child { margin-top: 0; }
.group-count {
  background: #21262d; padding: 0 6px; border-radius: 8px; font-size: .65rem; color: #c9d1d9;
}
.card-name  { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; }
.dot        { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.card-private { flex-shrink: 0; font-size: .78rem; line-height: 1; }
.card-archive {
  margin-left: auto; flex-shrink: 0; width: 22px; height: 22px;
  background: none; border: 1px solid #30363d; border-radius: 3px;
  color: #8b949e; font-size: .7rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.card-archive:hover { border-color: #e3b341; color: #e3b341; }
.card-uuid  { font-size: .65rem; color: #8b949e; font-family: monospace; margin-top: 3px; }
.card-lastseen { font-size: .65rem; color: #8b949e; font-family: monospace; margin-top: 3px; }
.card-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 7px; font-size: .72rem; color: #8b949e; }
.stat-val   { color: #c9d1d9; font-weight: 600; }

/* ── Log entries (shown in the panel while a device is drilled into) ── */
.log-row {
  background: #21262d; border: 1px solid #30363d; border-radius: 6px;
  padding: 8px 10px; margin-bottom: 4px; cursor: pointer; transition: border-color .2s;
}
.log-row:hover  { border-color: #58a6ff; }
.log-row.active { border-color: #e3b341; background: #2b2000; }
.log-time { font-family: monospace; font-size: .74rem; color: #c9d1d9; }
.log-meta { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 4px; font-size: .68rem; color: #8b949e; }

/* ── Leaflet overrides ───────────────────────────── */
.leaflet-control-resetview a {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; background: #fff; border-radius: 4px;
  text-decoration: none; color: #333;
}
.leaflet-control-resetview a:hover { background: #f4f4f4; }
.leaflet-popup-content-wrapper {
  background: #161b22; color: #c9d1d9;
  border: 1px solid #30363d; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.5);
}
.leaflet-popup-tip          { background: #161b22; }
.leaflet-popup-close-button { color: #8b949e !important; font-size: 1rem !important; }
.leaflet-popup-close-button:hover { color: #c9d1d9 !important; }
.popup-name  { font-size: .9rem; font-weight: 700; color: #58a6ff; margin-bottom: 10px; }
.popup-row   { display: flex; justify-content: space-between; gap: 16px; padding: 4px 0; border-bottom: 1px solid #21262d; font-size: .75rem; }
.popup-row:last-child { border-bottom: none; }
.popup-label { color: #8b949e; white-space: nowrap; }
.popup-val   { color: #c9d1d9; font-family: monospace; text-align: right; }
.crumb-tip   {
  background: #161b22; color: #c9d1d9; border: 1px solid #30363d;
  border-radius: 4px; font-size: .7rem; padding: 2px 6px; box-shadow: none;
}
.crumb-tip::before { display: none; }

@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1);    box-shadow: 0 0 4px 1px var(--c); }
  50%      { opacity: 0.4; transform: scale(1.6); box-shadow: 0 0 10px 4px var(--c); }
}
.crumb-latest { animation: pulse 0.8s ease-in-out infinite; border-radius: 50%; }

/* ── Modal (replaces native prompt()/confirm()) ─────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center; z-index: 2000;
}
.modal {
  width: 340px; max-width: 90vw; background: #161b22; border: 1px solid #30363d;
  border-radius: 8px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
.modal-title { font-size: .92rem; font-weight: 600; color: #58a6ff; margin-bottom: 14px; }
.modal-body { font-size: .82rem; color: #c9d1d9; margin-bottom: 18px; }
.modal-body label { display: block; font-size: .72rem; color: #8b949e; margin: 12px 0 4px; }
.modal-body label:first-child { margin-top: 0; }
.modal-body input[type="password"], .modal-body input[type="text"] {
  width: 100%; height: 32px; padding: 0 8px; background: #0d1117; border: 1px solid #30363d;
  border-radius: 4px; color: #c9d1d9; font-size: .82rem; outline: none;
}
.modal-body input:focus { border-color: #58a6ff; }
.modal-error { color: #f85149; font-size: .75rem; margin-top: 10px; min-height: 1em; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-actions .btn {
  height: 30px; padding: 0 12px; border-radius: 4px; background: #21262d;
  border: 1px solid #30363d; color: #c9d1d9; font-size: .78rem; cursor: pointer;
}
.modal-actions .btn.primary { border-color: #58a6ff; color: #58a6ff; }

/* ── Device notes ────────────────────────────────────────────────── */
.card-notes {
  width: 100%; margin-top: 8px; padding: 6px 8px; background: #0d1117;
  border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9;
  font-size: .74rem; font-family: inherit; outline: none; resize: none;
}
.card-notes:focus { border-color: #58a6ff; }
.card-notes::placeholder { color: #6e7681; }
</style>
</head>
<body>

<div id="topbar">
  <div></div>
  <a id="brand-link" href="/">
    <div id="brand">
      <span id="brand-tag">USCENTCOM</span>
      <span id="brand-name">LAZY GOBY</span>
      <span id="brand-sub">BLE TAG VIEWER</span>
    </div>
  </a>
  <div id="topbar-right">
    <div id="live-wrap">
      <div id="live-dot"></div>
      <span id="live-label">connecting…</span>
    </div>
    <div id="user-menu">
      <button id="user-menu-btn" onclick="toggleUserMenu(event)">
        <span id="user-avatar"></span>
        <span id="user-menu-name"></span>
        <span id="user-menu-caret">▾</span>
      </button>
      <div id="user-menu-dropdown">
        <div id="user-menu-header">
          <div id="user-menu-fullname"></div>
          <div id="user-menu-username"></div>
          <span id="user-menu-role">Member</span>
        </div>
        <a href="/admin" id="user-menu-management" class="user-menu-item" style="display:none;">Management</a>
        <button class="user-menu-item" onclick="closeUserMenu(); openChangePassword();">Change password</button>
        <button class="user-menu-item danger" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</div>

<div id="main">
  <div id="map">
    <div id="detailbar">
      <span id="detail-name"></span>
      <div id="window-control">
        <input id="window-range" type="range" min="0" max="3" step="1" value="1"
               oninput="setWindow(this.value)" title="Time window shown for this device">
        <span id="window-label">Last 30 days</span>
      </div>
      <div id="mode-control">
        <button id="mode-track" class="mode-btn active" onclick="setViewMode('track')" title="Show breadcrumb trail">Track</button>
        <button id="mode-heatmap" class="mode-btn" onclick="setViewMode('heatmap')" title="Show density heatmap">Heatmap</button>
      </div>
      <button id="detail-archive" onclick="archiveSelected()" title="Archive this device">🗄 Archive</button>
      <button id="detail-back" onclick="exitDetail()">← Back to overview</button>
    </div>
  </div>
  <div id="panel">
    <div id="panel-header">
      <div id="panel-header-left">
        <span id="panel-title"></span>
        <div id="view-tabs-wrap">
          <span id="view-tabs-label">Devices</span>
          <div id="view-tabs">
            <button id="tab-devices" class="view-tab active" onclick="setArchivedView(false)">Active</button>
            <button id="tab-archived" class="view-tab" onclick="setArchivedView(true)">Archived</button>
          </div>
        </div>
      </div>
      <span id="device-count">0</span>
    </div>
    <div id="search-wrap">
      <input type="text" id="device-search" placeholder="Search devices…" oninput="setDeviceSearch(this.value)">
    </div>
    <div id="device-list"><div id="empty">No data received yet</div></div>
  </div>
</div>

<div id="modal-backdrop" class="modal-backdrop" style="display:none;" onclick="if (event.target === this) closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="modal-confirm-btn"></button>
    </div>
  </div>
</div>

<script>
// ── Leaflet icon fix ──────────────────────────────────────────────
delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
  iconUrl:       '/static/leaflet/images/marker-icon.png',
  iconRetinaUrl: '/static/leaflet/images/marker-icon-2x.png',
  shadowUrl:     '/static/leaflet/images/marker-shadow.png',
});

// ── Map ───────────────────────────────────────────────────────────
const map = L.map('map').setView([33.30, 44.39], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19, subdomains: 'abc'
}).addTo(map);

L.Control.ResetView = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control-resetview');
    const a   = L.DomUtil.create('a', '', div);
    a.title = 'Reset view'; a.href = '#';
    a.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/>
      <path d="M12 8v4l3 3"/>
      <line x1="12" y1="3" x2="12" y2="1"/><line x1="12" y1="23" x2="12" y2="21"/>
      <line x1="3" y1="12" x2="1" y2="12"/><line x1="23" y1="12" x2="21" y2="12"/>
    </svg>`;
    L.DomEvent.on(a, 'click', e => { L.DomEvent.preventDefault(e); resetView(); });
    return div;
  }
});
new L.Control.ResetView().addTo(map);

// ── State ─────────────────────────────────────────────────────────
// Devices are colored by group, not individually. An admin can set an
// explicit color per group (Admin page); groups without one fall back to
// cycling through this palette (stable per group_id for the session).
// Devices with no group ("Unassigned") always get a fixed neutral gray.
const FALLBACK_COLORS = ['#2563eb','#16a34a','#dc2626','#9333ea','#ea580c','#0891b2','#65a30d','#be185d','#7c3aed','#b45309'];
const UNASSIGNED_COLOR = '#6e7681';
const fallbackColorMap = {};
let fallbackColorIdx = 0;
function getColor(d) {
  if (d.group_color) return d.group_color;
  if (!d.group_id) return UNASSIGNED_COLOR;
  if (!(d.group_id in fallbackColorMap)) {
    fallbackColorMap[d.group_id] = FALLBACK_COLORS[fallbackColorIdx++ % FALLBACK_COLORS.length];
  }
  return fallbackColorMap[d.group_id];
}

const layers  = {};
let allTracks = [];
let cachedDevices = [];
let currentUser = null;
let deviceNotesEnabled = false;

// Drill-down: at most one device's full trail is ever shown at a time.
// Overview (selectedDevice === null) shows only latest-position markers.
let selectedDevice = null;
let highlightedIdx = null;   // index into the selected device's points, or null
let windowDays = 30;   // 7 | 30 | 90 | 'all' — drill-down time window, reset to 30 on every fresh selection
let viewMode = 'track';   // 'track' | 'heatmap' — drill-down visualization mode, reset to 'track' on every fresh selection

// Archived devices are excluded from /api/tracks and /api/devices (and from
// live SSE pushes) server-side — the panel's "Archived" view fetches them
// separately with ?archived=1 and is mutually exclusive with drill-down.
let showArchived = false;

// Which group sections are expanded in the device list — independent of the
// filter below (this is purely a list-declutter UX toggle, available to
// every user, and does not affect the map). All groups start collapsed.
let expandedGroups = new Set();

// Always returns a string. group_id round-trips through HTML attributes
// (onclick="...('${key}')") which always stringifies — comparing that against
// a bare numeric group_id later (e.g. Set.has()) would never match, silently
// breaking the filter. Normalizing to a string once here is what fixes that.
function groupKey(groupId) {
  return groupId == null ? 'unassigned' : String(groupId);
}

// Per-device show/hide — the single source of truth for map/list visibility,
// available to every user (a personal declutter preference, not access
// control: the server already only sends devices the caller may see).
// The group-level checkbox is just a bulk "select/deselect all" convenience
// over this same set, not a separate suppressing layer — that's deliberate:
// an earlier version had an independent hiddenGroups Set ANDed with this one,
// which made it impossible to re-show one device inside an otherwise-hidden
// group (the group filter always won). Resets on every page load, never persisted.
let hiddenDevices = new Set();

function passesDeviceFilter(uuid) {
  return !hiddenDevices.has(uuid);
}

function isDeviceVisible(d) {
  return passesDeviceFilter(d.uuid);
}

function toggleDeviceFilter(uuid) {
  const turningOn = hiddenDevices.has(uuid);
  if (turningOn) hiddenDevices.delete(uuid);
  else hiddenDevices.add(uuid);
  renderPanel(null);
  renderTracks(allTracks);
  if (turningOn) ensureVisible([uuid]);
}

// Free-text device search (name match), scoped to the overview device list.
// Purely narrows what's displayed — never touches the map or hidden-state
// filters above, so clearing the search always restores the prior view.
let deviceSearch = '';

function setDeviceSearch(value) {
  deviceSearch = value.trim().toLowerCase();
  renderPanel(null);
}

// ── Utilities ─────────────────────────────────────────────────────
function tsToMs(ts) {
  if (!ts) return null;
  return new Date((ts.includes('T') ? ts : ts.replace(' ', 'T')) + 'Z').getTime();
}
function ago(ts) {
  if (!ts) return '—';
  let s = Math.floor((Date.now() - tsToMs(ts)) / 1000);
  if (isNaN(s) || s < 0) return '—';
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600);  s %= 3600;
  const m = Math.floor(s / 60);    s %= 60;
  if (d) return `${d}d ${h}h ${m}m`;
  if (h) return `${h}h ${m}m ${s}s`;
  if (m) return `${m}m ${s}s`;
  return `${s}s`;
}

const WINDOW_STEPS = [7, 30, 90, 'all'];   // slider positions 0..3 → days shown ('all' = full history)

function windowLabel(days) {
  return days === 'all' ? 'All history' : `Last ${days} days`;
}

// Single source of truth for "which points are currently shown" for the
// drilled-in device. Used by renderTracks() (crumbs/polyline), renderLog()
// (row list), reapplyHighlight()/highlightFix() (index resolution), and
// bounds-fitting — keeps crumb indices and log-row indices consistent since
// both are always built from the identical windowed array in the same pass.
function getVisiblePoints(track) {
  const points = track?.points || [];
  if (windowDays === 'all') return points;
  const cutoff = Date.now() - windowDays * 86400000;
  return points.filter(p => tsToMs(p.timestamp) >= cutoff);
}

// Fits the map to a given point set. No-ops if empty so switching to a
// window with zero fixes doesn't yank the viewport.
function fitToPoints(points) {
  if (!points.length) return;
  if (points.length < 2) {
    map.setView([points[0].lat, points[0].lon], 16, { animate: true });
  } else {
    const bounds = L.latLngBounds(points.map(p => [p.lat, p.lon]));
    map.fitBounds(bounds.pad(0.25));
  }
}

// Resets the slider + label to match `windowDays` — called on every fresh
// drill-down so the control never carries over a previous device's position.
function syncWindowUI() {
  document.getElementById('window-range').value = WINDOW_STEPS.indexOf(windowDays);
  document.getElementById('window-label').textContent = windowLabel(windowDays);
}

// Resets the two view-mode buttons to match `viewMode` — called on every
// fresh drill-down so the toggle never carries over a previous device's mode.
function syncViewModeUI() {
  document.getElementById('mode-track').classList.toggle('active', viewMode === 'track');
  document.getElementById('mode-heatmap').classList.toggle('active', viewMode === 'heatmap');
}

// ── Drill-down ────────────────────────────────────────────────────
function selectDevice(uuid) {
  const track = allTracks.find(t => t.uuid === uuid);
  if (!track?.points?.length) return;

  selectedDevice = uuid;
  highlightedIdx = null;
  windowDays = 30;              // every fresh drill-down starts at the 30-day default
  viewMode = 'track';           // every fresh drill-down starts in track (crumbs+line) mode
  syncWindowUI();
  syncViewModeUI();
  renderTracks(allTracks);
  renderPanel(null);

  document.getElementById('detail-name').textContent = track.name;
  document.getElementById('detailbar').style.display  = 'flex';

  fitToPoints(getVisiblePoints(track));
}

// Called by the view-mode toggle buttons. Re-renders the drilled-in device
// in the newly selected visualization mode using the same windowed point set
// — does not touch windowDays, highlightedIdx, or the camera.
function setViewMode(mode) {
  viewMode = mode;
  syncViewModeUI();
  renderTracks(allTracks);
}

// Called by the drill-down time-window slider. Re-derives everything that
// depends on "which points are visible" and clears the highlight, since a
// previously-highlighted index may point past the end of the new windowed
// array or now refer to a different fix entirely.
function setWindow(pos) {
  windowDays = WINDOW_STEPS[Number(pos)];
  document.getElementById('window-label').textContent = windowLabel(windowDays);
  highlightedIdx = null;
  renderTracks(allTracks);   // rebuilds crumbs/polyline for the new window; its trailing
                              // reapplyHighlight() call clears the (now-null) highlight marker
  renderLog();

  const track = allTracks.find(t => t.uuid === selectedDevice);
  if (track) fitToPoints(getVisiblePoints(track));
}

function exitDetail() {
  selectedDevice = null;
  highlightedIdx = null;
  renderTracks(allTracks);   // repopulates layers with every device now that selectedDevice is null
  renderPanel(null);
  document.getElementById('detailbar').style.display = 'none';
  resetView();
}

function archiveSelected() {
  if (selectedDevice) archiveDevice(null, selectedDevice);
}

async function archiveDevice(evt, uuid) {
  evt?.stopPropagation();
  if (selectedDevice === uuid) exitDetail();
  await fetch(`/api/devices/${uuid}/archive`, { method: 'POST' });
  await loadAll();
}

async function unarchiveDevice(evt, uuid) {
  evt?.stopPropagation();
  await fetch(`/api/devices/${uuid}/unarchive`, { method: 'POST' });
  showArchived = false;
  await loadAll();
}

async function setArchivedView(want) {
  if (showArchived === want) return;
  showArchived = want;
  if (showArchived) await renderArchived();
  else renderPanel(cachedDevices);
}

// The archived list is fetched on demand (not kept live) — it's a
// management view, not something that needs to track incoming fixes.
async function renderArchived() {
  const devices = await fetch('/api/devices?archived=1').then(r => r.json());

  document.getElementById('panel-title').style.display = 'none';
  document.getElementById('view-tabs-wrap').style.display = 'flex';
  document.getElementById('search-wrap').style.display = 'none';
  document.getElementById('tab-devices').classList.remove('active');
  document.getElementById('tab-archived').classList.add('active');
  document.getElementById('device-count').textContent = devices.length;

  const list = document.getElementById('device-list');
  if (!devices.length) { list.innerHTML = '<div id="empty">No archived devices</div>'; return; }

  list.innerHTML = devices.map(d => {
    const color = getColor(d);
    return `<div class="card">
      <div class="card-name">
        <div class="dot" style="background:${color}"></div>
        ${d.name}
        ${currentUser?.is_admin ? `<button class="card-archive" onclick="unarchiveDevice(event,'${d.uuid}')" title="Unarchive device">↩</button>` : ''}
      </div>
      <div class="card-uuid">${d.uuid}</div>
      <div class="card-stats">
        <span><span class="stat-val">${d.fix_count}</span> fixes</span>
        <span><span class="stat-val">${ago(d.last_seen)}</span></span>
      </div>
      <div class="card-lastseen">${d.last_seen || '—'}</div>
    </div>`;
  }).join('');
}

// Highlights one fix from the log list: marks the crumb on the map and
// re-renders the log so the matching row shows as active.
function setHighlightedFix(idx) {
  highlightedIdx = idx;
  reapplyHighlight();
  renderLog();
}

// Re-places the pulsing highlight marker over the current fix — called both
// from setHighlightedFix() and after every renderTracks() (crumbs are rebuilt
// on each render, so a live update would otherwise silently drop the
// highlight). A separate overlay marker (rather than restyling the crumb
// itself) so it pulses like the latest-position dot and is never buried
// under the trail/line — Leaflet always draws markers above path overlays.
let highlightMarker = null;

function reapplyHighlight() {
  if (highlightMarker) { highlightMarker.remove(); highlightMarker = null; }
  if (!selectedDevice || highlightedIdx === null) return;

  const track = allTracks.find(t => t.uuid === selectedDevice);
  const pt = track ? getVisiblePoints(track)[highlightedIdx] : undefined;
  if (!pt) return;

  highlightMarker = L.marker([pt.lat, pt.lon], { icon: markerIcon('#e3b341'), interactive: false }).addTo(map);
}

// Map-only: clicking a crumb dot selects that fix and zooms in close on it.
function highlightFix(idx) {
  const track = allTracks.find(t => t.uuid === selectedDevice);
  const pt = track ? getVisiblePoints(track)[idx] : undefined;
  if (!pt) return;
  setHighlightedFix(idx);
  map.flyTo([pt.lat, pt.lon], 18, { duration: 0.6 });
}

// Log list: selects the row (same highlight as highlightFix) but zooms OUT
// to the whole track instead of in on the single fix — the log list is for
// picking a row to inspect while keeping the full-trail overview, map clicks
// are for drilling into one specific point.
function selectLogRow(idx) {
  setHighlightedFix(idx);
  const track = allTracks.find(t => t.uuid === selectedDevice);
  if (track) fitToPoints(getVisiblePoints(track));
}

// ── Map rendering ─────────────────────────────────────────────────
function markerIcon(color) {
  return L.divIcon({
    html: `<div class="crumb-latest" style="width:20px;height:20px;background:${color};border:3px solid #fff;--c:${color}"></div>`,
    className: '', iconSize: [20,20], iconAnchor: [10,10]
  });
}

function popupHtml(name, uuid, pt) {
  return `<div class="popup-name">${name}</div>` + [
    ['UUID',       uuid],
    ['Observed',   pt.timestamp   || '—'],
    ['Ingested',   pt.ingest_time || '—'],
    ['Lat / Lon',  `${pt.lat.toFixed(6)}, ${pt.lon.toFixed(6)}`],
    ['Accuracy',   `±${pt.accuracy ?? '—'} m`],
    ['Confidence', pt.confidence  ?? '—'],
  ].map(([l,v]) => `<div class="popup-row"><span class="popup-label">${l}</span><span class="popup-val">${v}</span></div>`).join('');
}

function makeCrumbs(points, color) {
  const n = points.length;
  return points.map((p, i) => {
    const t = n > 1 ? i / (n - 1) : 1;
    return L.circleMarker([p.lat, p.lon], {
      radius: 2.5 + 1.5 * t, color, fillColor: color,
      fillOpacity: 0.12 + 0.55 * t, opacity: (0.12 + 0.55 * t) * 0.6, weight: 1
    })
      .bindTooltip(p.timestamp || '—', { permanent: false, direction: 'top', className: 'crumb-tip' })
      // Clicking the dot is the only way to zoom into one specific fix — the
      // log list intentionally does something different (selectLogRow(),
      // zooms OUT to the whole track). Index matches getVisiblePoints(track),
      // same array both this and the log list are built from.
      .on('click', () => highlightFix(i));
  });
}

function renderTracks(tracks) {
  for (const l of Object.values(layers)) {
    l.crumbs?.forEach(c => c.remove());
    l.path?.remove();
    l.heat?.remove();
    l.marker.remove();
  }
  for (const k of Object.keys(layers)) delete layers[k];

  for (const track of tracks) {
    const { uuid, name, points } = track;
    if (!points.length) continue;
    // While drilled into a device, only that device is shown at all.
    if (selectedDevice && uuid !== selectedDevice) continue;
    // In overview, the group/device filters can hide whole groups or single markers.
    if (!selectedDevice && !isDeviceVisible(track)) continue;

    const color  = getColor(track);
    const latest = points[points.length - 1];   // true latest fix — unaffected by the time window
    const marker = L.marker([latest.lat, latest.lon], { icon: markerIcon(color) })
      .addTo(map)
      .bindPopup(popupHtml(name, uuid, latest), { offset: [0, -14], maxWidth: 260 })
      .bindTooltip(`${name} — ${latest.timestamp || '—'}`, { direction: 'top', offset: [0, -14], className: 'crumb-tip' })
      .on('click', () => selectDevice(uuid));

    const entry = { marker };

    if (uuid === selectedDevice) {
      const visible = getVisiblePoints(track);
      if (viewMode === 'heatmap') {
        // Density heatmap for the same windowed point set as track mode —
        // single canvas layer, so this stays fast even at thousands of points.
        entry.heat = L.heatLayer(visible.map(p => [p.lat, p.lon]), {
          radius: 18, blur: 22, maxZoom: 17, minOpacity: 0.25
        }).addTo(map);
      } else {
        // Drilled-in device, track mode: breadcrumb trail + connecting line
        // for the currently selected time window only, not the full history.
        entry.crumbs = makeCrumbs(visible, color).map(c => c.addTo(map));
        entry.path   = L.polyline(visible.map(p => [p.lat, p.lon]), { color, weight: 1, opacity: 0.3 }).addTo(map);
      }
    }

    layers[uuid] = entry;
  }

  reapplyHighlight();
}

// ── Panel ─────────────────────────────────────────────────────────
function escapeHtml(s) {
  return (s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function deviceCardHtml(d) {
  const color    = getColor(d);
  const isActive = d.uuid === selectedDevice;
  const shown    = passesDeviceFilter(d.uuid);
  return `<div class="card${isActive ? ' active' : ''}${shown ? '' : ' device-hidden'}" onclick="selectDevice('${d.uuid}')">
    <div class="card-name">
      <input type="checkbox" class="device-check" ${shown ? 'checked' : ''}
        onclick="event.stopPropagation()" onchange="toggleDeviceFilter('${d.uuid}')" title="Show/hide this device">
      <div class="dot" style="background:${color}"></div>
      ${d.name}
      ${d.private ? '<span class="card-private" title="Private device — visible only to specifically granted users">🔒</span>' : ''}
      ${currentUser?.is_admin ? `<button class="card-archive" onclick="archiveDevice(event,'${d.uuid}')" title="Archive device">🗄</button>` : ''}
    </div>
    <div class="card-uuid">${d.uuid}</div>
    <div class="card-stats">
      <span><span class="stat-val">${d.fix_count}</span> fixes</span>
      <span>±<span class="stat-val">${d.accuracy}</span>m</span>
      <span>conf <span class="stat-val">${d.confidence}</span></span>
      <span><span class="stat-val">${ago(d.last_seen)}</span></span>
    </div>
    <div class="card-lastseen">${d.last_seen || '—'}</div>
    ${deviceNotesEnabled ? `<input type="text" class="card-notes" placeholder="Add a note…" value="${escapeHtml(d.notes)}"
      onclick="event.stopPropagation()" onmousedown="event.stopPropagation()"
      onkeydown="if(event.key==='Enter') this.blur()"
      onblur="saveDeviceNotes('${d.uuid}', this.value)">` : ''}
  </div>`;
}

async function saveDeviceNotes(uuid, value) {
  const notes = value.trim();
  const cached = cachedDevices.find(d => d.uuid === uuid);
  if (cached && (cached.notes || '') === notes) return;   // unchanged, skip network call
  try {
    await fetch(`/api/devices/${uuid}/notes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes }),
    });
    if (cached) cached.notes = notes;
  } catch (e) {
    // best-effort save — leave the typed value in the field, don't disrupt the UI
  }
}

// Buckets devices by their server-derived group, preserving each group's
// internal ordering (already sorted by last_seen from the API). "Unassigned"
// always sorts last since it's a leftover/triage bucket, not a real group.
function groupDevicesByGroup(devices) {
  const byKey = new Map();
  for (const d of devices) {
    const key = groupKey(d.group_id);
    if (!byKey.has(key)) {
      byKey.set(key, { key, name: d.group_name || 'Unassigned', color: getColor(d), devices: [] });
    }
    byKey.get(key).devices.push(d);
  }
  const groups = Array.from(byKey.values());
  groups.sort((a, b) => {
    if (a.key === 'unassigned') return 1;
    if (b.key === 'unassigned') return -1;
    return a.name.localeCompare(b.name);
  });
  return groups;
}

// Bulk "select/deselect all" convenience over hiddenDevices for one group —
// not a separate suppressing layer, so individual device cards stay
// toggleable afterward (see the note on hiddenDevices above). Looks up the
// group's full device list from cachedDevices (not the currently-rendered,
// possibly search-narrowed list) so it always acts on every device in the
// group regardless of what the search box is currently showing.
function toggleGroupFilter(key) {
  const uuids = cachedDevices.filter(d => groupKey(d.group_id) === key).map(d => d.uuid);
  const allShown = uuids.every(u => !hiddenDevices.has(u));
  if (allShown) uuids.forEach(u => hiddenDevices.add(u));
  else uuids.forEach(u => hiddenDevices.delete(u));
  renderPanel(null);
  renderTracks(allTracks);
  if (!allShown) ensureVisible(uuids);   // was off, just turned every device in the group on
}

// Toggles whether a group's device cards are shown in the side list. Purely
// a list-declutter UX preference — never affects the map or the filter.
function toggleGroupExpanded(key) {
  if (expandedGroups.has(key)) expandedGroups.delete(key);
  else expandedGroups.add(key);
  renderPanel(null);
}

function renderPanel(devices) {
  if (devices) cachedDevices = devices;
  else devices = cachedDevices;

  if (selectedDevice) { renderLog(); return; }
  if (showArchived) return;   // archived view manages its own fetch/render

  const allGroups = groupDevicesByGroup(devices);
  const fullDevicesByKey = new Map(allGroups.map(g => [g.key, g.devices]));
  const searching = deviceSearch.length > 0;
  // Search only narrows what's displayed — never touches hiddenDevices,
  // and groups with zero matches are dropped entirely rather than shown empty.
  const groups = searching
    ? allGroups
        .map(g => ({ ...g, devices: g.devices.filter(d => d.name.toLowerCase().includes(deviceSearch)) }))
        .filter(g => g.devices.length > 0)
    : allGroups;
  const showFilterCheckbox = allGroups.length > 1;
  const visibleCount = devices.filter(isDeviceVisible).length;

  document.getElementById('panel-title').style.display = 'none';
  document.getElementById('view-tabs-wrap').style.display = 'flex';
  document.getElementById('search-wrap').style.display = 'block';
  document.getElementById('tab-devices').classList.add('active');
  document.getElementById('tab-archived').classList.remove('active');
  document.getElementById('device-count').textContent = visibleCount;
  const list = document.getElementById('device-list');
  if (!devices.length) { list.innerHTML = '<div id="empty">No data received yet</div>'; return; }
  if (searching && !groups.length) { list.innerHTML = '<div id="empty">No devices match your search</div>'; return; }

  list.innerHTML = groups.map(g => {
    // Reflects every device in the group (not just the search-narrowed subset
    // being rendered below), so the checkbox state stays meaningful while searching.
    const fullDevices = fullDevicesByKey.get(g.key) ?? g.devices;
    const allShown = fullDevices.every(d => passesDeviceFilter(d.uuid));
    const expanded = searching || expandedGroups.has(g.key);
    return `
      <div class="group-header">
        ${showFilterCheckbox
          ? `<input type="checkbox" class="group-check" ${allShown ? 'checked' : ''}
               onchange="toggleGroupFilter('${g.key}')" title="Show/hide all ${g.name} devices">`
          : ''}
        <span class="group-toggle" onclick="toggleGroupExpanded('${g.key}')">
          <span class="group-arrow">${expanded ? '▾' : '▸'}</span>
          <span class="dot" style="background:${g.color}"></span>
          ${g.name} <span class="group-count">${g.devices.length}</span>
        </span>
      </div>
      ${expanded ? g.devices.map(deviceCardHtml).join('') : ''}
    `;
  }).join('');
}

// Log entries for the currently drilled-in device, within the active time
// window — newest fix first. Clicking a row highlights the matching dot.
function renderLog() {
  const track  = allTracks.find(t => t.uuid === selectedDevice);
  const points = track ? getVisiblePoints(track) : [];

  document.getElementById('view-tabs-wrap').style.display = 'none';
  document.getElementById('search-wrap').style.display = 'none';
  document.getElementById('panel-title').style.display = 'inline';
  document.getElementById('panel-title').textContent = track?.name ?? 'Device';
  document.getElementById('device-count').textContent = points.length;

  const list = document.getElementById('device-list');
  if (!points.length) {
    const msg = track?.points?.length ? 'No fixes in the selected window' : 'No fixes for this device';
    list.innerHTML = `<div id="empty">${msg}</div>`;
    return;
  }

  list.innerHTML = points.map((p, i) => {
    const isActive = i === highlightedIdx;
    return `<div class="log-row${isActive ? ' active' : ''}" onclick="selectLogRow(${i})">
      <div class="log-time">${p.timestamp || '—'}</div>
      <div class="log-meta">
        <span>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span>
        <span>±${p.accuracy ?? '—'}m</span>
        <span>conf ${p.confidence ?? '—'}</span>
      </div>
    </div>`;
  }).reverse().join('');
}

// ── Navigation ────────────────────────────────────────────────────
function resetView() {
  const latlngs = Object.values(layers).map(l => l.marker.getLatLng());
  if (latlngs.length) map.fitBounds(L.latLngBounds(latlngs).pad(0.2));
  else map.setView([33.30, 44.39], 14);
}

// Called after a filter toggle turns one or more specific devices ON, with
// exactly those uuids — not the whole visible set. Checking "is anything at
// all in view" was wrong: other devices already on-screen would satisfy that
// check even though the device(s) just enabled are off-screen and invisible.
// Re-fits the view only if NONE of the just-enabled devices are within the
// current viewport; if at least one already is, the view is left untouched
// (still respecting "don't yank my pan/zoom on every toggle").
function ensureVisible(uuids) {
  if (!uuids.length) return;
  const bounds = map.getBounds();
  const anyInView = uuids.some(u => layers[u] && bounds.contains(layers[u].marker.getLatLng()));
  if (!anyInView) resetView();
}

// ── Modal (replaces native prompt()/confirm()) ─────────────────────
// onConfirm may return `false` to keep the modal open (e.g. validation
// failed) — anything else closes it.
function openModal(title, bodyHtml, { confirmLabel = 'Save', onConfirm }) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const btn = document.getElementById('modal-confirm-btn');
  btn.textContent = confirmLabel;
  btn.onclick = async () => {
    const result = await onConfirm();
    if (result !== false) closeModal();
  };
  document.getElementById('modal-backdrop').style.display = 'flex';
  const firstField = document.querySelector('#modal-body input');
  if (firstField) firstField.focus();
}

function closeModal() {
  document.getElementById('modal-backdrop').style.display = 'none';
}

document.addEventListener('keydown', (e) => {
  const backdrop = document.getElementById('modal-backdrop');
  if (backdrop.style.display === 'none') return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') document.getElementById('modal-confirm-btn').click();
});

function openChangePassword() {
  openModal('Change password', `
    <label for="modal-current-pw">Current password</label>
    <input type="password" id="modal-current-pw" autocomplete="current-password">
    <label for="modal-new-pw">New password</label>
    <input type="password" id="modal-new-pw" autocomplete="new-password">
    <div class="modal-error" id="modal-pw-error"></div>
  `, {
    confirmLabel: 'Change',
    onConfirm: async () => {
      const current_password = document.getElementById('modal-current-pw').value;
      const new_password = document.getElementById('modal-new-pw').value;
      const errEl = document.getElementById('modal-pw-error');
      if (!new_password) { errEl.textContent = 'New password is required'; return false; }
      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current_password, new_password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { errEl.textContent = data.error || 'Failed to change password'; return false; }
      } catch (e) { errEl.textContent = 'Failed to change password'; return false; }
    },
  });
}

// ── Data & SSE ────────────────────────────────────────────────────
function syncUserUI() {
  const fullName = [currentUser.first_name, currentUser.last_name].filter(Boolean).join(' ');
  const displayName = fullName || currentUser.username;
  const initial = (currentUser.first_name || currentUser.username || '?').charAt(0).toUpperCase();

  document.getElementById('user-avatar').textContent = initial;
  document.getElementById('user-menu-name').textContent = displayName;
  document.getElementById('user-menu-fullname').textContent = displayName;
  // Only show the username as a separate line when it's not already the
  // displayed name (i.e. a real first/last name is set) — avoids redundancy.
  document.getElementById('user-menu-username').textContent = fullName ? `@${currentUser.username}` : '';
  const roleEl = document.getElementById('user-menu-role');
  roleEl.textContent = currentUser.is_admin ? 'Admin' : 'Member';
  roleEl.classList.toggle('admin', currentUser.is_admin);
  document.getElementById('user-menu-management').style.display = currentUser.is_admin ? 'block' : 'none';
  document.getElementById('detail-archive').style.display = currentUser.is_admin ? 'inline-block' : 'none';
}

function toggleUserMenu(evt) {
  evt?.stopPropagation();
  document.getElementById('user-menu').classList.toggle('open');
}

function closeUserMenu() {
  document.getElementById('user-menu').classList.remove('open');
}

document.addEventListener('click', (e) => {
  const menu = document.getElementById('user-menu');
  if (menu.classList.contains('open') && !menu.contains(e.target)) closeUserMenu();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeUserMenu();
});

async function logout() {
  await fetch('/logout', { method: 'POST' });
  window.location.href = '/login';
}

async function loadAll() {
  const [tracks, devices, me, settings] = await Promise.all([
    fetch('/api/tracks').then(r => r.json()),
    fetch('/api/devices').then(r => r.json()),
    fetch('/api/me').then(r => r.json()),
    fetch('/api/settings').then(r => r.json()),
  ]);
  currentUser = me;
  deviceNotesEnabled = settings.device_notes_enabled;
  syncUserUI();
  allTracks = tracks;
  renderTracks(allTracks);
  renderPanel(devices);
  resetView();
}

function connectSSE() {
  const dot   = document.getElementById('live-dot');
  const label = document.getElementById('live-label');
  const es    = new EventSource('/stream');
  es.onopen  = () => { dot.className = 'on'; label.textContent = 'Live'; };
  es.onerror = () => { dot.className = ''; label.textContent = 'reconnecting…'; es.close(); setTimeout(connectSSE, 5000); };
  es.onmessage = e => {
    for (const obs of JSON.parse(e.data)) {
      let track = allTracks.find(t => t.uuid === obs.uuid);
      if (!track) {
        track = { uuid: obs.uuid, name: obs.name, points: [], group_id: obs.group_id, group_color: obs.group_color };
        allTracks.push(track);
      } else {
        // Keep in sync in case an admin changes the group's color while this page is open.
        track.group_id = obs.group_id;
        track.group_color = obs.group_color;
      }
      if (!track.points.some(p => p.timestamp === obs.obs_time)) {
        track.points.push({ lat: obs.lat, lon: obs.lon, timestamp: obs.obs_time, ingest_time: obs.ingest_time, accuracy: obs.accuracy, confidence: obs.confidence });
        track.points.sort((a,b) => (a.timestamp??'') < (b.timestamp??'') ? -1 : 1);
      }
    }
    renderTracks(allTracks);
    fetch('/api/devices').then(r => r.json()).then(renderPanel);
  };
}

setInterval(() => fetch('/api/devices').then(r => r.json()).then(renderPanel), 30000);
loadAll().then(connectSSE);
</script>
