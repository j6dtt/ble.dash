<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — USCENTCOM - LAZY GOBY BLE TAG VIEWER</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }

#topbar {
  height: 56px; background: #161b22; border-bottom: 1px solid #30363d;
  display: flex; align-items: center; justify-content: center; padding: 0 18px;
}
#brand { display: flex; align-items: baseline; gap: 14px; white-space: nowrap; }
#brand-tag {
  font-size: 1.5rem; font-weight: 800; letter-spacing: .3px;
  background: linear-gradient(90deg, #3fb950, #7ee2a8 70%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#brand-name {
  font-size: 1.5rem; font-weight: 800; letter-spacing: .3px;
  background: linear-gradient(90deg, #58a6ff, #a5d6ff 70%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#brand-sub {
  font-size: .95rem; font-weight: 600; letter-spacing: 1px;
  color: #8b949e; text-transform: uppercase;
}

#login-main { display: flex; align-items: center; justify-content: center; height: calc(100vh - 56px); }
#card {
  width: 320px; background: #161b22; border: 1px solid #30363d;
  border-radius: 10px; padding: 28px 26px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
#card-title { font-size: .95rem; font-weight: 600; color: #c9d1d9; text-align: center; margin-bottom: 22px; }
label { display: block; font-size: .72rem; color: #8b949e; margin-bottom: 4px; }
input[type="text"], input[type="password"] {
  width: 100%; height: 34px; padding: 0 10px; margin-bottom: 16px;
  background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
  color: #c9d1d9; font-size: .85rem; outline: none;
}
input[type="text"]:focus, input[type="password"]:focus { border-color: #58a6ff; }
button {
  width: 100%; height: 36px; border-radius: 6px; border: 1px solid #30363d;
  background: #21262d; color: #c9d1d9; font-size: .85rem; font-weight: 600; cursor: pointer;
}
button:hover { border-color: #58a6ff; color: #58a6ff; }
#error {
  background: #2b2000; border: 1px solid #e3b341; color: #e3b341;
  border-radius: 6px; padding: 8px 10px; font-size: .75rem; margin-bottom: 16px;
}
</style>
</head>
<body>
<div id="topbar">
  <div id="brand">
    <span id="brand-tag">USCENTCOM</span>
    <span id="brand-name">LAZY GOBY</span>
    <span id="brand-sub">BLE TAG VIEWER</span>
  </div>
</div>
<div id="login-main">
  <div id="card">
    <div id="card-title">Sign in</div>
    {% if error %}<div id="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autofocus required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</div>
</body>
</html>
